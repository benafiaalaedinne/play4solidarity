<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Sponsor Dashboard — Play4Solidarity</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #FBE8EF, #FFE6F2);
            min-height: 100vh;
        }

        /* Navbar */
        .navbar {
            background-color: #0B1A54;
            padding: 12px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* Logo and title container */
        .logo-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .navbar img {
            height: 40px;
        }

        .navbar-title {
            font-size: 22px;
            font-weight: 600;
            color: #FBE8EF;
        }

        /* Nav links as buttons */
        .nav-links {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: #FBE8EF;
            text-decoration: none;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 6px;
            background-color: transparent;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            background-color: #FF4C7B;
            color: white;
        }

        /* Active page highlight */
        .nav-links a.active {
            background-color: #FF4C7B;
            color: white;
        }

        /* Responsive Navbar */
        @media (max-width: 768px) {
            .nav-links {
                flex-direction: column;
                width: 100%;
                margin-top: 10px;
            }

            .nav-links a {
                width: 100%;
                text-align: center;
            }
        }

        /* Container */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        /* Card */
        .card {
            background: white;
            width: 100%;
            max-width: 600px;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0px 15px 35px rgba(0, 0, 0, 0.08);
            margin-bottom: 40px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0px 25px 50px rgba(0, 0, 0, 0.12);
        }

        h2 {
            color: #0B1A54;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #FF4C7B;
            font-size: 16px;
            margin-bottom: 25px;
            font-weight: 600;
        }

        /* Inputs */
        input {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #ddd;
            margin-bottom: 18px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #FF4C7B;
            box-shadow: 0 0 8px rgba(255, 76, 123, 0.3);
            outline: none;
        }

        /* Button */
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #0B1A54, #152b7c);
            color: white;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: linear-gradient(90deg, #152b7c, #0B1A54);
            transform: translateY(-2px);
        }

        /* Success Message */
        #successMessage {
            margin-top: 20px;
            background: #28a745;
            padding: 12px;
            color: white;
            border-radius: 6px;
            font-size: 15px;
            display: none;
            opacity: 0;
            transition: opacity 0.7s ease-in-out;
        }

        /* Sponsors Table */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        table th,
        table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        table th {
            background-color: #0B1A54;
            color: #FBE8EF;
            font-weight: 600;
        }

        table tr:hover {
            background-color: #FFE6F2;
        }

        /* Responsive */
        @media (max-width: 650px) {
            .card {
                padding: 30px 20px;
            }

            table th,
            table td {
                padding: 10px;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <div class="navbar">
        <div class="logo-title">
            <img src="logo.png" alt="logo">
            <span class="navbar-title">Play4Solidarity</span>
        </div>
        <nav class="nav-links">
            <a href="#">Home</a>
            <a href="#">Tournaments & Events</a>
            <a href="#">Contact Us</a>
            <a href="#">About Us</a>
            <a href="#">Missions</a>
            <a href="#" class="active">Sponsor Donations</a>
            <a href="#">Profile</a>
        </nav>
    </div>

    <div class="container">

        <!-- Donation Form Card -->
        <div class="card">
            <h2>Add Sponsor Donation</h2>
            <p class="subtitle">Support our solidarity gaming mission!</p>

            <form id="donationForm" onsubmit="addSponsor(event)">
                <input type="text" id="name" placeholder="Full Name" required>
                <input type="email" id="email" placeholder="Email" required>
                <input type="text" id="phone" placeholder="Phone Number" required>
                <input type="number" id="amount" placeholder="Amount (DT)" required min="1">

                <button class="btn">Add Sponsor</button>
            </form>

            <div id="successMessage">Donation added successfully! Thank you ❤️</div>
        </div>

        <!-- Sponsors Table Card -->
        <div class="card">
            <h2>All Sponsors</h2>
            <table id="sponsorTable">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Amount (DT)</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Sponsors will be added here dynamically -->
                </tbody>
            </table>
        </div>

    </div>

    <script>
        // Load saved sponsors from localStorage on page load
        window.onload = function () {
            const sponsors = JSON.parse(localStorage.getItem("sponsors") || "[]");
            sponsors.forEach(sponsor => addRowToTable(sponsor));
        }

        function addSponsor(event) {
            event.preventDefault();

            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const phone = document.getElementById("phone").value;
            const amount = document.getElementById("amount").value;

            const sponsor = { name, email, phone, amount };

            // Add to table
            addRowToTable(sponsor);

            // Save to localStorage
            const sponsors = JSON.parse(localStorage.getItem("sponsors") || "[]");
            sponsors.push(sponsor);
            localStorage.setItem("sponsors", JSON.stringify(sponsors));

            // Show success message
            const msg = document.getElementById("successMessage");
            msg.style.display = "block";
            setTimeout(() => { msg.style.opacity = "1"; }, 50);
            setTimeout(() => {
                msg.style.opacity = "0";
                setTimeout(() => { msg.style.display = "none"; }, 700);
            }, 2000);

            // Reset form
            document.getElementById("donationForm").reset();
        }

        function addRowToTable(sponsor) {
            const table = document.getElementById("sponsorTable").getElementsByTagName('tbody')[0];
            const newRow = table.insertRow();

            newRow.innerHTML = `
                <td>${sponsor.name}</td>
                <td>${sponsor.email}</td>
                <td>${sponsor.phone}</td>
                <td>${sponsor.amount} DT</td>
            `;
        }
    </script>

</body>

</html>
