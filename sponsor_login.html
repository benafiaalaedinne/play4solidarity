<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Sponsor Login — Play4Solidarity</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet" />

    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: #FBE8EF;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background-color: #0B1A54;
            padding: 12px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-logo {
            height: 40px;
            width: auto;
        }

        .navbar-title {
            font-size: 22px;
            font-weight: 600;
            color: #FBE8EF;
        }

        .nav-links {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: #FBE8EF;
            text-decoration: none;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            background-color: #FF4C7B;
            color: white;
        }

        .container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .card {
            background: white;
            width: 100%;
            max-width: 480px;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
            position: relative;
        }

        h2 {
            color: #0B1A54;
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .subtitle {
            color: #FF4C7B;
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 25px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 18px;
            align-items: center;
        }

        input {
            width: 90%;
            padding: 14px 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 15px;
            transition: 0.3s ease;
        }

        input:focus {
            border-color: #FF4C7B;
            box-shadow: 0 0 8px rgba(255, 76, 123, 0.3);
            outline: none;
        }

        .btn {
            padding: 15px;
            width: 90%;
            background-color: #0B1A54;
            color: white;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .btn:hover {
            background-color: #152b7c;
            transform: translateY(-2px);
        }

        /* Centered message */
        .message {
            width: 90%;
            margin: 0 auto 20px auto;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            display: none;
            text-align: center;
            animation: fadeIn 0.4s ease;
        }

        .error {
            background-color: #FFD6DE;
            color: #B8002E;
            border-left: 5px solid #FF4C7B;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <div class="navbar">
        <div class="logo-title">
            <img src="logo.png" class="nav-logo" alt="Play4Solidarity Logo">
            <span class="navbar-title">Play4Solidarity</span>
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="tournaments.html">Tournaments & Events</a>
            <a href="contact.html">Contact Us</a>
            <a href="about.html">About Us</a>
            <a href="missions.html">Missions</a>
            <a href="sponsor_donations.html">Sponsor Donations</a>
            <a href="profile.html">Profile</a>
        </div>
    </div>

    <!-- Page Content -->
    <div class="container">
        <div class="card">

            <!-- Centered message -->
            <div id="msgBox" class="message"></div>

            <h2>Sponsor Login</h2>
            <p class="subtitle">Access your sponsor space</p>

            <form onsubmit="return validateForm()">
                <input id="email" type="email" placeholder="Sponsor Email" required />
                <input id="password" type="password" placeholder="Password (min 8 characters)" required />
                <button class="btn" type="submit">Login</button>
            </form>

        </div>
    </div>

    <script>
        function validateForm() {
            const msgBox = document.getElementById("msgBox");
            const password = document.getElementById("password").value;

            msgBox.style.display = "none";

            if (password.length < 8) {
                msgBox.className = "message error";
                msgBox.textContent = "⚠️ Password must contain at least 8 characters.";
                msgBox.style.display = "block";
                return false;
            }

            /* SUCCESS → redirect to dashboard */
            window.location.href = "sponsor_dashboard.html";
            return false; // prevent normal form submission
        }
    </script>

</body>

</html>
